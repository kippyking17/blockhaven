<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blockhaven</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100vw; height: 100vh; overflow: hidden; background-color: #000; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>

  <script>
    // Disable right-click menu
    document.addEventListener('contextmenu', event => event.preventDefault());

    // Block shortcuts: F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U
    document.onkeydown = function(e) {
      if (e.keyCode == 123 || 
         (e.ctrlKey && e.shiftKey && e.keyCode == 73) || 
         (e.ctrlKey && e.shiftKey && e.keyCode == 74) || 
         (e.ctrlKey && e.keyCode == 85)) {
        return false;
      }
    }

    // Load iframe link dynamically using Base64 encoding
    window.addEventListener('DOMContentLoaded', () => {
      // Encoded URL string
      const encodedUrl = "aHR0cHM6Ly9ibG9ja2hhdmVuLWNhbGViLm1hcGxlY2xvdmUxNi5jaGF0Z3B0LnNpdGUvP3Jvb209MjMyMw==";
      document.getElementById('gameFrame').src = atob(encodedUrl);
    });
  </script>
</head>
<body>
  <iframe id="gameFrame" allowfullscreen></iframe>
</body>
</html>
